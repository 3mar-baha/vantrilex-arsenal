<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المحادثة — thread</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="thread">
<a class="skip" href="#main">تخطي إلى المحادثة · skip to conversation</a>
<header class="topbar">
  <div class="brand">
    <nav aria-label="تنقل"><a class="back" href="index.html">→ كل الخيوط · all threads</a></nav>
    <h1>المحادثة <span class="latin">thread</span></h1>
    <p class="conn" id="connBadge" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="connText">جارٍ الاتصال… · connecting</span></p>
  </div>
  <div class="tools">
    <label class="search"><span class="visually-hidden">بحث في الخيوط · search threads</span><input id="search" type="search" placeholder="بحث… · search" autocomplete="off"></label>
    <label class="master"><input type="checkbox" id="masterToggle"><span>تنبيهات ntfy · master</span></label>
    <button type="button" id="refreshBtn" class="ghost">تحديث · refresh</button>
    <button type="button" id="settingsBtn" class="ghost" aria-label="إعدادات الاتصال · connection settings">⚙</button>
  </div>
</header>
<div class="banner" id="modeBanner" role="status"></div>
<div class="app">
  <nav class="sidebar" aria-label="الخيوط · threads">
    <p class="side-hint" id="sideHint">المثبت أعلى القائمة يحتاج تدخلك — pinned needs-action stays on top.</p>
    <ul id="threadList" class="threads"></ul>
  </nav>
  <main class="convo" id="main" aria-label="المحادثة · conversation" tabindex="-1">
    <section class="thread-head" aria-label="بيانات الخيط">
      <h2 id="threadTitle">المحادثة · thread</h2>
      <div class="head-row">
        <div class="pills" id="threadMeta" aria-label="status pills"></div>
        <label class="toggle"><input type="checkbox" id="ntfyToggle"><span>تنبيه ntfy لهذا الخيط · this thread</span></label>
      </div>
      <p class="hint" id="ntfyNote"></p>
    </section>
    <ol id="msgList" class="msgs" aria-live="polite"></ol>
    <section class="compose" aria-label="رسالة جديدة · new message">
      <h3>رسالة جديدة <span class="latin">send</span></h3>
      <form id="sendForm">
        <label for="fTitle">العنوان · title</label>
        <input id="fTitle" name="title" required maxlength="200" autocomplete="off">
        <label for="fBody">النص · body</label>
        <textarea id="fBody" name="body" rows="3" required maxlength="4000"></textarea>
        <label class="check"><input type="checkbox" id="fNeeds"><span>تحتاج تدخل المستخدم · needs_user_action</span></label>
        <div class="send-row"><button type="submit" id="sendBtn">إرسال · send</button><p class="hint" id="sendNote" role="status"></p></div>
      </form>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
