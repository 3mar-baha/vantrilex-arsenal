<text x="727" y="40.2" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="0.4" fill="#FFFFFF" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan font-weight="700">القدرة</tspan></text>
<text x="463" y="40.2" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="0.4" fill="#FFFFFF" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan font-weight="700">مع الترسانة</tspan></text>
<text x="199" y="40.2" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="0.4" fill="#FFFFFF" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan font-weight="700">بدون الترسانة</tspan></text>
<text x="727" y="81.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">فهرس المكوّنات</text>
<text x="463" y="81.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">لا شيء محفوظ بصيغة آلية</text>
<text x="199" y="81.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan direction="ltr" unicode-bidi="isolate">2,737</tspan> سجلًّا عبر 6 أنواع</text>
<text x="727" y="125.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">أوامر التثبيت</text>
<text x="463" y="125.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">مخترَعة، أو مُهمَلة بصمت</text>
<text x="199" y="125.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan>12 مُتحقَّقًا، والباقي </tspan><tspan font-weight="700">غير مُتحقَّق</tspan></text>
<text x="727" y="169.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">إعادة الإعداد</text>
<text x="463" y="169.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">يُعاد سرده يدويًا في كل مرة</text>
<text x="199" y="169.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan>نفس الـ</tspan><tspan direction="ltr" unicode-bidi="isolate">52</tspan><tspan> جزءًا بتثبيت </tspan><tspan font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13" direction="ltr" unicode-bidi="isolate">commit</tspan></text>
<text x="727" y="213.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">سلامة البيانات</text>
<text x="463" y="213.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan direction="ltr" unicode-bidi="isolate">6</tspan> فحوص للسجل + <tspan direction="ltr" unicode-bidi="isolate">11</tspan> فحصًا للطقم</text>
<text x="199" y="213.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">غير مفحوصة</text>
<text x="727" y="257.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">بوابات الإصدار</text>
<text x="463" y="257.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan direction="ltr" unicode-bidi="isolate">6</tspan> بوابات، كل واحدة تنتهي بـ <tspan direction="ltr" unicode-bidi="isolate">0</tspan></text>
<text x="199" y="257.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">متذكَّرة، غير مُنفَّذة</text>
<text x="727" y="301.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">فصل الأدوار</text>
<text x="463" y="301.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan direction="ltr" unicode-bidi="isolate">3</tspan> مهارات عليا + <tspan direction="ltr" unicode-bidi="isolate">4</tspan> وكلاء بأدوار</text>
<text x="199" y="301.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">ارتجالي، بنمط مطالبة واحد</text>
<text x="727" y="345.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">توثيق المشروع الهدف</text>
<text x="463" y="345.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">نظام توثيق من <tspan direction="ltr" unicode-bidi="isolate">28</tspan> ملفًا، مُولَّد</text>
<text x="199" y="345.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">يُكتب يدويًا، حالة بحالة</text>
<text x="727" y="389.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">سقف السياق</text>
<text x="463" y="389.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13" direction="ltr" unicode-bidi="isolate">mcp_cap</tspan><tspan> = <tspan direction="ltr" unicode-bidi="isolate">8</tspan>، يرفض النمو</tspan></text>
<text x="199" y="389.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">لا سقف للخوادم المقيمة</text>
<text x="727" y="433.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">الإعداد لأول مرة</text>
<text x="463" y="433.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan direction="ltr" unicode-bidi="isolate">~10–15</tspan> دقيقة تشغيل مهارات</text>
<text x="199" y="433.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan direction="ltr" unicode-bidi="isolate">~30–60</tspan> دقيقة عمل يدوي</text>
<text x="727" y="477.14" text-anchor="start" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve">إعادة الإعداد، المشروع نفسه</text>
<text x="463" y="477.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan direction="ltr" unicode-bidi="isolate">~5</tspan> دقائق، لا شيء يُعاد تحديده</text>
<text x="199" y="477.14" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="13" font-weight="400" fill="#000000" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan direction="ltr" unicode-bidi="isolate">~30–60</tspan> دقيقة مرة أخرى</text>
<rect x="18" y="512" width="3" height="13" fill="#ADD8E6"/>
<text x="30" y="520.5" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4169E1" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan font-weight="700">تقديرات توضيحية — ليست قياسات معيارية.</tspan></text>
<text x="18" y="535.5" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="11" font-weight="400" fill="#000000" fill-opacity="0.72" direction="rtl" unicode-bidi="embed" xml:space="preserve">الخلايا المعلَّمة بعلامة <tspan direction="ltr" unicode-bidi="isolate">~</tspan> هي تخمينات تقريبية برتبة مقدار لمشروع صغير؛ ولم يقس هذا المستودع نفسه قط.</text>
<text x="18" y="550.5" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro','Noto Kufi Arabic',Arial,sans-serif" font-size="11" font-weight="400" fill="#000000" fill-opacity="0.72" direction="rtl" unicode-bidi="embed" xml:space="preserve">وكل رقم غير معلَّم هو عدد مُتحقَّق منه في المستودع.</text>
</svg>
