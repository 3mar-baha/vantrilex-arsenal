<title id="figTitle">مع ترسانة Vantrilex وبدونها — مقارنة القدرات</title>
<desc id="figDesc">جدول مقارنة جديد. عشر قدرات تُقارن بين مشروع بلا مساعدة ومشروع مجهَّز بترسانة Vantrilex. الخلايا المعلَّمة بعلامة ~(tilde) تقديرات توضيحية تقريبية — ليست قياسات معيارية؛ وكل رقم غير معلَّم هو عدد مُتحقَّق منه في المستودع.</desc>
