<text x="18" y="439.5" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#000000" fill-opacity="0.72" xml:space="preserve">Every time figure here is a rough order-of-magnitude guess for one small change. No timing in this repository has ever been measured; read these</text>
