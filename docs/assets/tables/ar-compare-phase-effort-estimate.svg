<title id="figTitle">الجهد التقريبي لكل مرحلة، مع الترسانة وبدونها — تقديرات فقط</title>
<desc id="figDesc">جدول مقارنة جديد للجهد التقريبي لكل مرحلة. سبع مراحل من التوجيه حتى الإصدار، لكل منها تقدير بلا مساعدة وتقدير بمساعدة الترسانة. كل رقم زمني هو تقدير توضيحي تقريبي بالدقائق — ليس قياسًا معياريًا مقيسًا.</desc>
