<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="rework-title rework-desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="rework-title">Approximate rework and rediscovery rates, with and without the Arsenal</title>
  <desc id="rework-desc">Grouped horizontal bar chart. Changes reworked after the first review pass: about 10 percent with the Arsenal, about 30 percent without. Decisions re-derived from scratch each session: about 20 percent with, about 50 percent without. All figures are rough illustrative estimates, not measured benchmarks.</desc>
  <rect x="0" y="0" width="720" height="450" fill="#FFFFFF"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#000000">Rework and rediscovery</text>
  <text x="40" y="74" font-size="13" fill="#000000" fill-opacity="0.7">What a session costs when nothing carries over</text>

  <g>
    <rect x="430" y="38" width="16" height="14" fill="#4169E1"/>
    <text x="452" y="50" font-size="12" fill="#000000">With Arsenal</text>
    <rect x="548" y="38" width="16" height="14" fill="#ADD8E6" stroke="#4169E1" stroke-width="1.5"/>
    <text x="570" y="50" font-size="12" fill="#000000">Without Arsenal</text>
  </g>

  <g stroke="#000000" stroke-opacity="0.14" stroke-width="1">
    <line x1="200" y1="120" x2="200" y2="354"/>
    <line x1="294" y1="120" x2="294" y2="354"/>
    <line x1="388" y1="120" x2="388" y2="354"/>
    <line x1="482" y1="120" x2="482" y2="354"/>
    <line x1="576" y1="120" x2="576" y2="354"/>
    <line x1="670" y1="120" x2="670" y2="354"/>
  </g>

  <text x="40" y="134" font-size="13" font-weight="600" fill="#000000">Reworked after first review</text>
  <rect x="200" y="148" width="78" height="26" fill="#4169E1"/>
  <text x="286" y="166" font-size="13" fill="#000000">~10%</text>
  <rect x="200" y="182" width="235" height="26" fill="#ADD8E6" stroke="#4169E1" stroke-width="1.5"/>
  <text x="443" y="200" font-size="13" fill="#000000">~30%</text>

  <text x="40" y="248" font-size="13" font-weight="600" fill="#000000">Decisions re-derived</text>
  <text x="40" y="266" font-size="13" font-weight="600" fill="#000000">each session</text>
  <rect x="200" y="278" width="157" height="26" fill="#4169E1"/>
  <text x="365" y="296" font-size="13" fill="#000000">~20%</text>
  <rect x="200" y="312" width="392" height="26" fill="#ADD8E6" stroke="#4169E1" stroke-width="1.5"/>
  <text x="600" y="330" font-size="13" fill="#000000">~50%</text>

  <line x1="200" y1="354" x2="670" y2="354" stroke="#000000" stroke-width="1.5"/>
  <g stroke="#000000" stroke-width="1.5">
    <line x1="200" y1="354" x2="200" y2="361"/>
    <line x1="294" y1="354" x2="294" y2="361"/>
    <line x1="388" y1="354" x2="388" y2="361"/>
    <line x1="482" y1="354" x2="482" y2="361"/>
    <line x1="576" y1="354" x2="576" y2="361"/>
  </g>
  <g font-size="11" fill="#000000" fill-opacity="0.75" text-anchor="middle">
    <text x="200" y="377">~0</text>
    <text x="294" y="377">~15</text>
    <text x="388" y="377">~30</text>
    <text x="482" y="377">~45</text>
    <text x="576" y="377">~60</text>
  </g>
  <text x="435" y="400" font-size="11" fill="#000000" fill-opacity="0.75" text-anchor="middle">percent, approximate</text>

  <text x="40" y="430" font-size="12" font-style="italic" fill="#000000">Illustrative estimates — not measured benchmarks.</text>
</svg>
