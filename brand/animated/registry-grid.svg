<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#4169E1" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>Pinned component set, animated</title>
  <desc>A light blue scan bar travels down the pinned grid and back, the way a selection is verified cell by cell. 4 second period, seamless loop. Base geometry from the Lucide grid-3x3 icon.</desc>
  <style>
    .scan { animation: scan 4s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes scan { 0%, 100% { transform: translateY(-6px); opacity: 0; } 50% { transform: translateY(12px); opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { .scan { animation: none; } }
  </style>
  <rect x="3" y="3" width="18" height="18" rx="2"/>
  <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
  <rect class="scan" x="3.6" y="6" width="16.8" height="3" fill="#ADD8E6" fill-opacity="0.85" stroke="none"/>
</svg>