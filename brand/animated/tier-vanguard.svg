<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#4169E1" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>Vantrilex Vanguard, tier two, animated</title>
  <desc>The Vanguard compass needle sweeps through 60 degrees while the light blue sweep ring breathes outward once per loop. 4 second period, seamless loop. Base geometry from the Lucide compass icon.</desc>
  <style>
    .needle { transform-box: view-box; transform-origin: 12px 12px; animation: needle 4s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .ring { transform-box: view-box; transform-origin: 12px 12px; animation: ring 4s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes needle { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }
    @keyframes ring { 0%, 100% { transform: scale(0.82); opacity: 0.2; } 50% { transform: scale(1); opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .needle, .ring { animation: none; } .ring { opacity: 0.9; } }
  </style>
  <circle cx="12" cy="12" r="10"/>
  <circle class="ring" cx="12" cy="12" r="6.5" stroke="#ADD8E6" stroke-width="1.25"/>
  <path class="needle" d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" fill="#4169E1" stroke="none"/>
</svg>